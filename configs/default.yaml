# Defaults for src.config.load_config(). Anything omitted falls back to the built-ins there.

data:
  ticker: "AAPL"
  start: "2019-01-01"
  end: "2026-11-21"         # exclusive; fixed so reruns use the same window (null = today)
  processed: "data/processed/clean_data.csv"

preprocess:
  target: "Close"

models:
  ml:
    contamination: 0.02
    n_estimators: 300
    random_state: 42
